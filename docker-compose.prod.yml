services:
  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: nginx
    expose:
      - "80"
    depends_on:
      php:
        condition: service_started
    restart: always

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: php
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_URL: ${APP_URL:?APP_URL must be set}

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-despensa}
      DB_USERNAME: ${DB_USERNAME:-despensa}
      DB_PASSWORD: ${DB_PASSWORD:-despensa}

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-warning}
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-despensa}
      MYSQL_USER: ${DB_USERNAME:-despensa}
      MYSQL_PASSWORD: ${DB_PASSWORD:-despensa}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  db_data:
